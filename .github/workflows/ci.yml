name: CI — Build & Test

# Triggers: run on every push to main, and on every Pull Request targeting main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Verify the Python backend installs and the API file has no errors
  # ─────────────────────────────────────────────────────────────────────────
  backend-check:
    name: "🐍 Backend — Install & Syntax Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Check api.py for syntax errors
        run: python -m py_compile backend/api.py && echo "✅ api.py syntax is valid"

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Verify the React frontend installs and builds successfully
  # ─────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: "⚛️  Frontend — Install & Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build React production bundle
        working-directory: frontend
        run: npm run build
        env:
          CI: false             # Prevents treating warnings as errors

      - name: Verify build output exists
        run: test -d frontend/build && echo "✅ Build folder created successfully"

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Build both Docker images (only runs if Jobs 1 & 2 pass)
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "🐳 Docker — Build Both Images"
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-build]  # Wait for both above jobs to pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t placement-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t placement-frontend ./frontend

      - name: Confirm both images exist
        run: |
          docker images placement-backend
          docker images placement-frontend
          echo "✅ Both Docker images built successfully"
